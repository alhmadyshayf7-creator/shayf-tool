name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile lib/lingokey_core.py bin/lingokey bin/lingokey-term
      - name: Unit tests
        run: PYTHONPATH=lib python tests/test_core.py
